<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>こどものとけい</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#f0fdf4;
    color:#374151;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
    transition:.3s;
}

body.dark-mode{
    background:#1a202c;
    color:#e2e8f0;
}

/*==========================
  テーマボタン
==========================*/

.theme-btn{
    align-self:flex-end;
    padding:8px 14px;
    border:none;
    border-radius:20px;
    background:#4ade80;
    color:white;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
}

body.dark-mode .theme-btn{
    background:#4b5563;
}

/*==========================
  縦・横レイアウト
==========================*/

.main-area{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.clock-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
}

@media (orientation:landscape){

    body{
        justify-content:center;
    }

    .main-area{
        flex-direction:row;
        justify-content:center;
        align-items:center;
        gap:40px;
    }

    .clock-wrapper{
        flex-shrink:0;
    }

    .clock-container{
        width:min(55vh,42vw)!important;
        height:min(55vh,42vw)!important;
        max-width:420px!important;
        max-height:420px!important;
    }

}

/*==========================
  カレンダー
==========================*/

.calendar-container{

    width:100%;
    max-width:340px;

    background:white;
    border-radius:20px;

    padding:14px;

    text-align:center;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

body.dark-mode .calendar-container{
    background:#2d3748;
}

.today-text{

    font-size:18px;
    font-weight:bold;
    color:#16a34a;
    margin-bottom:10px;

}

body.dark-mode .today-text{
    color:#4ade80;
}

.cal-table{

    width:100%;
    border-collapse:collapse;

}

.cal-table th,
.cal-table td{

    width:14.28%;
    text-align:center;
    padding:4px 0;
    font-size:13px;
    font-weight:bold;

}

.sun{
    color:#ef4444;
}

.sat{
    color:#3b82f6;
}

.weekday{
    color:#6b7280;
}

body.dark-mode .weekday{
    color:#a0aec0;
}

.today-circle{

    display:inline-block;
    width:25px;
    height:25px;
    line-height:25px;

    border-radius:50%;

    background:#4ade80;
    color:white!important;

}

/*==========================
  時計
==========================*/

.clock-container{

    position:relative;

    width:75vw;
    height:75vw;

    max-width:340px;
    max-height:340px;

    border-radius:50%;

    background:white;

    border:14px solid #4ade80;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

body.dark-mode .clock-container{

    background:#2d3748;
    border-color:#4b5563;

}

.center-dot{

    position:absolute;

    top:50%;
    left:50%;

    width:12px;
    height:12px;

    transform:translate(-50%,-50%);

    background:#374151;

    border-radius:50%;

    z-index:100;

}

body.dark-mode .center-dot{
    background:#e2e8f0;
}

/*==========================
  針
==========================*/

.hand{

    position:absolute;
    left:50%;
    bottom:50%;

    transform-origin:bottom center;

    border-radius:10px;

}

.hour-hand{

    width:8px;
    height:26%;

    background:#ef4444;

    transform:translateX(-50%);
    z-index:5;

}

.minute-hand{

    width:5px;
    height:37%;

    background:#3b82f6;

    transform:translateX(-50%);
    z-index:4;

}

.second-hand{

    width:2px;
    height:42%;

    background:#9ca3af;

    transform:translateX(-50%);
    z-index:3;

}

/*==========================
  数字
==========================*/

.number{

    position:absolute;

    display:flex;
    justify-content:center;
    align-items:center;

    transform:translate(-50%,-50%);

    user-select:none;

}

.hour-num{

    color:#ef4444;
    font-weight:bold;
    font-size:26px;
    z-index:20;

}

.min-num{

    color:#2563eb;
    font-size:9px;
    z-index:10;

}

body.dark-mode .hour-num{
    color:#f87171;
}

body.dark-mode .min-num{
    color:#60a5fa;
}

/*==========================
  デジタル時計
==========================*/

.digital-display{

    margin-top:18px;

    background:white;

    padding:12px 28px;

    border-radius:40px;

    box-shadow:0 4px 10px rgba(0,0,0,.05);

    font-size:30px;
    font-weight:bold;

    white-space:nowrap;

}

body.dark-mode .digital-display{

    background:#2d3748;

}

.ampm{

    color:#16a34a;
    font-size:22px;
    margin-right:10px;

}

.text-red{
    color:#ef4444;
}

.text-blue{
    color:#2563eb;
}

body.dark-mode .text-red{
    color:#f87171;
}

body.dark-mode .text-blue{
    color:#60a5fa;
}
</style>

</head>

<body>

<button class="theme-btn"
        id="themeBtn"
        onclick="toggleTheme()">
🌙 よるのモード
</button>
<div class="main-area">

    <!-- カレンダー -->
    <div class="calendar-container">

        <div class="today-text" id="todayDate"></div>

        <table class="cal-table">

            <thead>
                <tr>
                    <th class="sun">にち</th>
                    <th class="weekday">げつ</th>
                    <th class="weekday">か</th>
                    <th class="weekday">すい</th>
                    <th class="weekday">もく</th>
                    <th class="weekday">きん</th>
                    <th class="sat">ど</th>
                </tr>
            </thead>

            <tbody id="calendarBody"></tbody>

        </table>

    </div>

    <!-- 時計 -->
    <div class="clock-wrapper">

        <div class="clock-container" id="clock">

            <div class="center-dot"></div>

            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>

        </div>

        <!-- デジタル時計 -->
        <div class="digital-display" id="digitalClock">

            <span class="ampm" id="ampm">
                ごぜん
            </span>

            <span class="text-red" id="dHour">
                12
            </span>

            じ

            <span class="text-blue" id="dMin">
                00
            </span>

            ふん

        </div>

    </div>

</div>

<script>

const clock = document.getElementById("clock");

const hourHand = document.getElementById("hourHand");
const minuteHand = document.getElementById("minuteHand");
const secondHand = document.getElementById("secondHand");

const dHour = document.getElementById("dHour");
const dMin = document.getElementById("dMin");
const ampm = document.getElementById("ampm");

const todayDate = document.getElementById("todayDate");
const calendarBody = document.getElementById("calendarBody");

const themeBtn = document.getElementById("themeBtn");

let isUser = false;

/*==========================
  テーマ切替
==========================*/

function toggleTheme() {

    isUser = true;

    document.body.classList.toggle("dark-mode");

    updateBtn();
}


/*==========================
  テーマボタン
==========================*/

function updateBtn() {

    themeBtn.innerText =
        document.body.classList.contains("dark-mode")
            ? "☀️ ひるのモード"
            : "🌙 よるのモード";
}


/*==========================
  時間による自動テーマ切替
==========================*/

function checkTheme(hour) {

    // 手動で変更した場合は自動変更しない
    if (isUser) return;

    const dark = (hour >= 19 || hour < 6);

    if (dark) {

        document.body.classList.add("dark-mode");

    } else {

        document.body.classList.remove("dark-mode");

    }

    updateBtn();
}


/*==========================
  時計の数字を作成
==========================*/

function createLabels() {

    /*------------------------
      ① 時の数字
      1～12
    ------------------------*/

    for (let i = 1; i <= 12; i++) {

        const angle =
            i * 30 * Math.PI / 180;

        const h =
            document.createElement("div");

        h.className =
            "number hour-num";

        h.innerText = i;

        /*
         * 時の数字は時計の中心から
         * 30%の位置に配置
         */

        h.style.left =
            `${50 + 30 * Math.sin(angle)}%`;

        h.style.top =
            `${50 - 30 * Math.cos(angle)}%`;

        clock.appendChild(h);
    }


    /*------------------------
      ② 分の数字
      0～59
    ------------------------*/

    for (let i = 0; i < 60; i++) {

        /*
         * 1分 = 6度
         *
         * 0分  → 12時方向
         * 15分 → 3時方向
         * 30分 → 6時方向
         * 45分 → 9時方向
         */

        const angle =
            i * 6 * Math.PI / 180;

        const m =
            document.createElement("div");

        m.className =
            "number min-num";

        m.innerText = i;


        /*
         * 5分ごとの数字と
         * それ以外の数字で
         * 配置する半径を変える
         *
         * 5分ごと：
         *   少し外側
         *
         * その他：
         *   少し内側
         */

        let radius;

        if (i % 5 === 0) {

            radius = 43;

            m.style.fontSize = "11px";
            m.style.fontWeight = "bold";
            m.style.opacity = "1";

        } else {

            radius = 39;

            m.style.fontSize = "7px";
            m.style.fontWeight = "normal";
            m.style.opacity = "0.75";

        }


        m.style.left =
            `${50 + radius * Math.sin(angle)}%`;

        m.style.top =
            `${50 - radius * Math.cos(angle)}%`;


        /*
         * 5分ごとの数字は青、
         * それ以外は少し薄くする
         */

        if (i % 5 === 0) {

            m.style.color = "#2563eb";

        } else {

            m.style.color = "#64748b";

        }


        clock.appendChild(m);
    }
}

/*==========================
  カレンダー更新
==========================*/

function updateCal() {

    const n = new Date();

    const y = n.getFullYear();
    const m = n.getMonth();
    const d = n.getDate();


    /* 曜日の名前 */

    const names = [
        "にちようび",
        "げつようび",
        "かようび",
        "すいようび",
        "もくようび",
        "きんようび",
        "どようび"
    ];


    /* 今日の日付表示 */

    todayDate.innerText =
        `${y}ねん ${m + 1}がつ ${d}にち ${names[n.getDay()]}`;


    /* カレンダーを一度クリア */

    calendarBody.innerHTML = "";


    /*
     * 月初の曜日
     *
     * 0 = 日曜日
     * 1 = 月曜日
     * ...
     * 6 = 土曜日
     */

    const first =
        new Date(y, m, 1).getDay();


    /*
     * 今月の最終日
     */

    const last =
        new Date(y, m + 1, 0).getDate();


    let row =
        document.createElement("tr");


    /*
     * 月初までの空白
     */

    for (let i = 0; i < first; i++) {

        row.appendChild(
            document.createElement("td")
        );

    }


    /*
     * 日付を作成
     */

    for (let i = 1; i <= last; i++) {

        /*
         * 7列埋まったら次の行へ
         */

        if (row.children.length === 7) {

            calendarBody.appendChild(row);

            row =
                document.createElement("tr");

        }


        const cell =
            document.createElement("td");


        /*
         * 曜日による色
         */

        const dayIndex =
            row.children.length;


        if (dayIndex === 0) {

            cell.className = "sun";

        } else if (dayIndex === 6) {

            cell.className = "sat";

        } else {

            cell.className = "weekday";

        }


        /*
         * 今日なら丸で囲む
         */

        if (i === d) {

            const circle =
                document.createElement("span");

            circle.className =
                "today-circle";

            circle.innerText = i;

            cell.appendChild(circle);

        } else {

            cell.innerText = i;

        }


        row.appendChild(cell);

    }


    /*
     * 最終行の空白を埋める
     */

    while (row.children.length < 7) {

        row.appendChild(
            document.createElement("td")
        );

    }


    calendarBody.appendChild(row);
}


/*==========================
  時計更新
==========================*/

function updateClock() {

    const n = new Date();

    const h = n.getHours();
    const m = n.getMinutes();
    const s = n.getSeconds();


    /*------------------------
      アナログ時計
    ------------------------*/


    /*
     * 時針
     *
     * 1時間 = 30度
     * 1分ごとに0.5度進む
     */

    const hourAngle =
        (h % 12) * 30 +
        m * 0.5;


    /*
     * 分針
     *
     * 1分 = 6度
     *
     * 秒も少し反映
     */

    const minuteAngle =
        m * 6 +
        s * 0.1;


    /*
     * 秒針
     */

    const secondAngle =
        s * 6;


    hourHand.style.transform =
        `translateX(-50%) rotate(${hourAngle}deg)`;


    minuteHand.style.transform =
        `translateX(-50%) rotate(${minuteAngle}deg)`;


    secondHand.style.transform =
        `translateX(-50%) rotate(${secondAngle}deg)`;


    /*------------------------
      ごぜん / ごご
    ------------------------*/

    if (h < 12) {

        ampm.innerText = "ごぜん";

    } else {

        ampm.innerText = "ごご";

    }


    /*------------------------
      12時間表示
    ------------------------*/

    let displayHour =
        h % 12;


    /*
     * 0時 → 12時
     *
     * 12時 → 12時
     */

    if (displayHour === 0) {

        displayHour = 12;

    }


    dHour.innerText =
        displayHour;


    /*------------------------
      分表示
    ------------------------*/

    dMin.innerText =
        String(m).padStart(2, "0");


    /*------------------------
      自動テーマ
    ------------------------*/

    checkTheme(h);


    /*------------------------
      日付が変わったら
      カレンダー更新
    ------------------------*/

    if (
        h === 0 &&
        m === 0 &&
        s === 0
    ) {

        updateCal();

    }

}


/*==========================
  初期化
==========================*/


/*
 * 時計の数字を作る
 */

createLabels();


/*
 * カレンダーを表示
 */

updateCal();


/*
 * 時計を表示
 */

updateClock();


/*
 * 1秒ごとに更新
 */

setInterval(
    updateClock,
    1000
);

</script>

</body>

</html>
