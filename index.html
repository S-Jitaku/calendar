<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>こどものとけい</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0fdf4; padding: 15px; color: #374151; transition: 0.3s; }
        body.dark-mode { background: #1a202c; color: #e2e8f0; }
        .theme-btn { align-self: flex-end; padding: 6px 12px; border: none; border-radius: 20px; background: #4ade80; color: white; font-weight: bold; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
        body.dark-mode .theme-btn { background: #4b5563; }
        .calendar-container { width: 100%; max-width: 340px; background: white; border-radius: 20px; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center; }
        body.dark-mode .calendar-container { background: #2d3748; }
        .today-text { font-size: 17px; font-weight: bold; color: #16a34a; margin-bottom: 8px; }
        body.dark-mode .today-text { color: #4ade80; }
        .cal-table { width: 100%; border-collapse: collapse; }
        .cal-table th, .cal-table td { width: 14.28%; text-align: center; padding: 4px 0; font-size: 13px; font-weight: bold; }
        .sun { color: #ef4444; } .sat { color: #3b82f6; } .weekday { color: #6b7280; }
        body.dark-mode .weekday { color: #a0aec0; }
        .today-circle { background: #4ade80; color: white !important; border-radius: 50%; display: inline-block; width: 24px; height: 24px; line-height: 24px; }
        .clock-container { position: relative; width: 75vw; height: 75vw; max-width: 300px; max-height: 300px; background: white; border-radius: 50%; border: 4vw solid #4ade80; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin-bottom: 15px; }
        body.dark-mode .clock-container { background: #2d3748; border-color: #4b5563; }
        @media (min-width: 450px) { .clock-container { border-width: 16px; } }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 4%; height: 4%; background: #374151; border-radius: 50%; transform: translate(-50%,-50%); z-index: 10; }
        body.dark-mode .center-dot { background: #e2e8f0; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 4px; }
        .hour-hand { width: 2.2%; height: 25%; background: #ef4444; transform: translateX(-50%); z-index: 3; }
        .minute-hand { width: 1.5%; height: 36%; background: #3b82f6; transform: translateX(-50%); z-index: 2; }
        .second-hand { width: 0.8%; height: 40%; background: #a0aec0; transform: translateX(-50%); z-index: 1; }
        .number { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; transform: translate(-50%, -50%); }
        .hour-num { font-size: max(18px, 6.5vw); color: #ef4444; }
        .min-num { font-size: max(11px, 3.5vw); color: #3b82f6; }
        body.dark-mode .hour-num { color: #f87171; } body.dark-mode .min-num { color: #60a5fa; }
        @media (min-width: 450px) { .hour-num { font-size: 26px; } .min-num { font-size: 13px; } }
        .digital-display { font-size: max(22px, 6vw); font-weight: bold; background: white; padding: 10px 30px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); white-space: nowrap; }
        body.dark-mode .digital-display { background: #2d3748; }
        @media (min-width: 450px) { .digital-display { font-size: 30px; } }
        .text-red { color: #ef4444; } .text-blue { color: #3b82f6; }
        body.dark-mode .text-red { color: #f87171; } body.dark-mode .text-blue { color: #60a5fa; }
    </style>
</head>
<body>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 よるのモード</button>
    <div class="calendar-container">
        <div class="today-text" id="todayDate"></div>
        <table class="cal-table">
            <thead>
                <tr><th class="sun">にち</th><th class="weekday">げつ</th><th class="weekday">か</th><th class="weekday">すい</th><th class="weekday">もく</th><th class="weekday">きん</th><th class="sat">ど</th></tr>
            </thead>
            <tbody id="calendarBody"></tbody>
        </table>
    </div>
    <div class="clock-container" id="clock">
        <div class="center-dot"></div>
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
    </div>
    <div class="digital-display" id="digitalClock">
        <span class="text-red" id="dHour">0</span>じ <span class="text-blue" id="dMin">00</span>ふん
    </div>
    <script>
        const clock = document.getElementById('clock');
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const dHour = document.getElementById('dHour');
        const dMin = document.getElementById('dMin');
        const todayDate = document.getElementById('todayDate');
        const calendarBody = document.getElementById('calendarBody');
        const themeBtn = document.getElementById('themeBtn');
        let isUser = false;
        function toggleTheme() { isUser = true; document.body.classList.toggle('dark-mode'); updateBtn(); }
        function updateBtn() { themeBtn.innerText = document.body.classList.contains('dark-mode') ? "☀️ ひるのモード" : "🌙 よるのモード"; }
        function checkTheme(h) { if (isUser) return; const dark = (h >= 19 || h < 6); if (dark && !document.body.classList.contains('dark-mode')) { document.body.classList.add('dark-mode'); updateBtn(); } else if (!dark && document.body.classList.contains('dark-mode')) { document.body.classList.remove('dark-mode'); updateBtn(); } }
        function createLabels() {
            for (let i = 1; i <= 12; i++) {
                const a = (i * 30) * (Math.PI / 180);
                const h = document.createElement('div'); h.className = 'number hour-num'; h.innerText = i; h.style.left = `${50 + 32 * Math.sin(a)}%`; h.style.top = `${50 - 32 * Math.cos(a)}%`; clock.appendChild(h);
                const m = document.createElement('div'); m.className = 'number min-num'; m.innerText = i * 5 === 60 ? '0' : i * 5; m.style.left = `${50 + 42 * Math.sin(a)}%`; m.style.top = `${50 - 42 * Math.cos(a)}%`; clock.appendChild(m);
            }
        }
        function updateCal() {
            const n = new Date(); const y = n.getFullYear(); const m = n.getMonth(); const d = n.getDate();
            const names = ["にちようび", "げつようび", "かようび", "すいようび", "もくようび", "きんようび", "どようび"];
            todayDate.innerText = `${y}ねん ${m + 1}がつ ${d}にち ${names[n.getDay()]}`; calendarBody.innerHTML = "";
            const first = new Date(y, m, 1).getDay(); const last = new Date(y, m + 1, 0).getDate(); let row = document.createElement('tr');
            for (let i = 0; i < first; i++) row.appendChild(document.createElement('td'));
            for (let i = 1; i <= last; i++) {
                if (row.children.length === 7) { calendarBody.appendChild(row); row = document.createElement('tr'); }
                const cell = document.createElement('td'); const idx = row.children.length; cell.className = idx === 0 ? 'sun' : (idx === 6 ? 'sat' : 'weekday');
                if (i === d) { const c = document.createElement('span'); c.className = 'today-circle'; c.innerText = i; cell.appendChild(c); } else { cell.innerText = i; }
                row.appendChild(cell);
            }
            while (row.children.length < 7) row.appendChild(document.createElement('td')); calendarBody.appendChild(row);
        }
        function updateClock() {
            const n = new Date(); const h = n.getHours(); const m = n.getMinutes(); const s = n.getSeconds();
            hourHand.style.transform = `translateX(-50%) rotate(${(h % 12) * 30 + m * 0.5}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${m * 6 + s * 0.1}deg)`;
            secondHand.style.transform = `translateX(-50%) rotate(${s * 6}deg)`;
            dHour.innerText = h; dMin.innerText = String(m).padStart(2, '0'); checkTheme(h);
            if (h === 0 && m === 0 && s === 0) updateCal();
        }
        createLabels(); updateCal(); updateClock(); setInterval(updateClock, 1000);
    </script>
</body>
</html>
